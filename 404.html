  <title>Siden findes ikke · Kasper Krog</title>
  <meta name="robots" content="noindex">

  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=20260911">
  <script>
    (function () {
      var key = 'kk-theme';
      var theme;
      try {
        var saved = JSON.parse(localStorage.getItem(key));
        if (saved && (saved.theme === 'dawn' || saved.theme === 'dusk') && saved.expiresAt > Date.now()) {
          theme = saved.theme;
        } else {
          localStorage.removeItem(key);
        }
      } catch (e) {
        try { localStorage.removeItem(key); } catch (e2) {}
      }
      if (!theme) {
        var hour = new Date().getHours();
        theme = hour >= 7 && hour < 19 ? 'dawn' : 'dusk';
      }
      document.documentElement.dataset.theme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) { meta.content = theme === 'dawn' ? '#f4f5f3' : '#16181a'; }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
